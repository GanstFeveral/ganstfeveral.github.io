<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">

<title>Twitch Stream Timer</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0 10px 0 0;
        background: transparent;
        font-family: 'Russo One', sans-serif;
        display: flex;
        align-items: flex-start;
        justify-content: flex-end;
        overflow: hidden;
    }

    #container {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        justify-content: flex-start;
        text-align: right;
        width: 100%;
        padding: 0;
    }

    .timer-row {
        display: flex;
        align-items: baseline;
        justify-content: flex-end;
        white-space: nowrap;
        width: 100%;
    }

    .timer-label {
        color: white;
        font-size: 48px;
        margin-right: 8px;
        white-space: nowrap;
        line-height: 1.1;
        text-shadow: none;
    }

    #chatSilentLabel {
        transition: color 0.5s ease, opacity 0.5s ease;
    }

    #timer,
    #moscowTime {
        display: inline-block;
        width: 390px;
        text-align: right;
        font-size: 72px;
        font-weight: normal;
        letter-spacing: 2px;
        white-space: nowrap;
        line-height: 1.1;
        text-shadow: none;
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum";
    }

    #timer {
        color: #36e36b;
        transition: color 0.5s ease, opacity 0.5s ease;
    }

    #moscowTime {
        color: white;
    }

    #statsBlock {
        align-self: stretch;
        width: 100%;
        text-align: left;
        margin-top: 12px;
        padding-right: 10px;
    }

    #totalMessages {
        color: white;
        font-size: 42px;
        text-align: right;
        margin: 0;
        line-height: 1.1;
        opacity: 0;
    }

    #judyContainer {
        margin-top: 10px;
        position: relative;
        width: 300px;
        height: 300px;
    }

    #judyContainer img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0;
        transition: opacity 2s ease;
    }
</style>
</head>

<body>

<div id="container">

    <div class="timer-row">
        <span class="timer-label" id="chatSilentLabel">ЧАТ МОЛЧИТ</span>
        <div id="timer">00:00:00</div>
    </div>

    <div class="timer-row">
        <span class="timer-label">ВРЕМЯ</span>
        <div id="moscowTime">00:00:00</div>
    </div>

    <div id="statsBlock">
        <div id="totalMessages">+0</div>
        <div id="judyContainer">
            <img id="judyImg1" alt="">
            <img id="judyImg2" alt="">
        </div>
    </div>

</div>

<script>
const CHANNEL = "ganstfeveral";

const JUDY1 = "https://raw.githubusercontent.com/GanstFeveral/ganstfeveral.github.io/refs/heads/master/obs/judy1.png";
const JUDY2 = "https://raw.githubusercontent.com/GanstFeveral/ganstfeveral.github.io/refs/heads/master/obs/judy2.png";
const JUDY5 = "https://raw.githubusercontent.com/GanstFeveral/ganstfeveral.github.io/refs/heads/master/obs/judy5.png";
const JUDY4 = "https://raw.githubusercontent.com/GanstFeveral/ganstfeveral.github.io/refs/heads/master/obs/judy4.png";
const JUDY3 = "https://raw.githubusercontent.com/GanstFeveral/ganstfeveral.github.io/refs/heads/master/obs/judy3.png";

const timerElement = document.getElementById("timer");
const moscowTimeElement = document.getElementById("moscowTime");
const chatSilentLabel = document.getElementById("chatSilentLabel");
const totalMessagesElement = document.getElementById("totalMessages");
const judyImg1 = document.getElementById("judyImg1");
const judyImg2 = document.getElementById("judyImg2");

let lastMessageTime = Date.now();

let totalMessages = 0;

let totalFadeTimeout = null;
let currentJudy = null;
let activeImg = 1;
let judy1Shown = false;

let socket = null;
let reconnectDelay = 2000;
let receiveBuffer = "";

function formatTime(totalSeconds) {
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    return [
        String(hours).padStart(2, "0"),
        String(minutes).padStart(2, "0"),
        String(seconds).padStart(2, "0")
    ].join(":");
}

function updateMoscowTime() {
    const now = new Date();
    const moscowTime = now.toLocaleTimeString("ru-RU", {
        timeZone: "Europe/Moscow",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
    });
    moscowTimeElement.textContent = moscowTime;
}

function updateTimer() {
    const elapsed = Math.floor((Date.now() - lastMessageTime) / 1000);

    timerElement.textContent = formatTime(elapsed);

    let color;
    if (elapsed < 60) {
        color = "#36e36b";
    } else if (elapsed < 120) {
        color = "#c8dc43";
    } else if (elapsed < 180) {
        color = "#ffe600";
    } else if (elapsed < 240) {
        color = "#ff981c";
    } else {
        color = "#ff3434";
    }

    timerElement.style.color = color;
    chatSilentLabel.style.color = color;

    let opacity;
    if (elapsed < 10) {
        opacity = "0";
    } else if (elapsed < 30) {
        const progress = (elapsed - 10) / 20;
        opacity = progress.toFixed(3);
    } else {
        opacity = "1";
    }

    timerElement.style.opacity = opacity;
    chatSilentLabel.style.opacity = opacity;

    updateJudy(elapsed, opacity);
}

function updateJudy(elapsed, baseOpacity) {
    if (elapsed < 2) {
        hideJudyImmediately();
        judy1Shown = false;
        return;
    }

    let targetSrc = null;

    if (elapsed < 60) {
        targetSrc = JUDY1;
    } else if (elapsed < 120) {
        targetSrc = JUDY2;
    } else if (elapsed < 180) {
        targetSrc = JUDY5;
    } else if (elapsed < 240) {
        targetSrc = JUDY4;
    } else {
        targetSrc = JUDY3;
    }

    if (targetSrc !== currentJudy) {
        const isFirstJudy1 = (targetSrc === JUDY1 && !judy1Shown);
        currentJudy = targetSrc;

        if (isFirstJudy1) {
            showJudyDirectly(targetSrc);
            judy1Shown = true;
        } else {
            crossfadeJudy(targetSrc);
        }
    }

    const visibleImg = activeImg === 1 ? judyImg1 : judyImg2;
    if (elapsed < 30 && currentJudy === JUDY1) {
        visibleImg.style.opacity = baseOpacity;
    } else if (currentJudy && elapsed >= 30) {
        visibleImg.style.opacity = "1";
    }
}

function hideJudyImmediately() {
    judyImg1.style.transition = "none";
    judyImg2.style.transition = "none";
    judyImg1.style.opacity = "0";
    judyImg2.style.opacity = "0";
    currentJudy = null;
    setTimeout(() => {
        judyImg1.style.transition = "opacity 2s ease";
        judyImg2.style.transition = "opacity 2s ease";
    }, 50);
}

function showJudyDirectly(src) {
    const img = activeImg === 1 ? judyImg1 : judyImg2;
    const other = activeImg === 1 ? judyImg2 : judyImg1;

    other.style.opacity = "0";
    img.src = src;
    img.style.transition = "none";
    img.style.opacity = "0";

    void img.offsetWidth;

    img.style.transition = "opacity 2s ease";
}

function crossfadeJudy(src) {
    const nextImg = activeImg === 1 ? judyImg2 : judyImg1;
    const currentImg = activeImg === 1 ? judyImg1 : judyImg2;

    nextImg.src = src;
    nextImg.style.opacity = "0";

    setTimeout(() => {
        nextImg.style.opacity = "1";
        currentImg.style.opacity = "0";
        activeImg = activeImg === 1 ? 2 : 1;
    }, 50);
}

function updateTotal() {
    totalMessagesElement.textContent = `+${totalMessages}`;
}

function triggerTotalFade() {
    if (totalFadeTimeout) clearTimeout(totalFadeTimeout);

    totalMessagesElement.style.transition = "none";
    totalMessagesElement.style.opacity = "0";

    void totalMessagesElement.offsetWidth;

    totalMessagesElement.style.transition = "opacity 0.5s ease";
    totalMessagesElement.style.opacity = "1";

    totalFadeTimeout = setTimeout(() => {
        totalMessagesElement.style.transition = "opacity 9.5s ease";
        totalMessagesElement.style.opacity = "0";
    }, 500);
}

function processMessage(tags, username) {
    lastMessageTime = Date.now();

    totalMessages++;

    hideJudyImmediately();
    judy1Shown = false;

    updateTimer();
    updateTotal();
    triggerTotalFade();
}

function parseTags(rawTags) {
    const tags = {};

    rawTags.split(";").forEach(tag => {
        const separatorIndex = tag.indexOf("=");

        if (separatorIndex === -1) {
            tags[tag] = "";
        } else {
            const key = tag.substring(0, separatorIndex);
            const value = tag.substring(separatorIndex + 1);

            tags[key] = value
                .replace(/\\s/g, " ")
                .replace(/\\:/g, ";")
                .replace(/\\r/g, "\r")
                .replace(/\\n/g, "\n")
                .replace(/\\\\/g, "\\");
        }
    });

    return tags;
}

function handleIRCMessage(message) {
    if (message.startsWith("PING")) {
        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send("PONG :tmi.twitch.tv");
        }
        return;
    }

    let tags = {};

    if (message.startsWith("@")) {
        const spaceIndex = message.indexOf(" ");

        if (spaceIndex === -1) return;

        tags = parseTags(message.substring(1, spaceIndex));
        message = message.substring(spaceIndex + 1);
    }

    const match = message.match(/^:([^!]+)!.* PRIVMSG #[^ ]+ :/);

    if (match) {
        const username = match[1];
        processMessage(tags, username);
    }
}

function connectToChat() {
    socket = new WebSocket("wss://irc-ws.chat.twitch.tv:443");

    socket.onopen = () => {
        console.log("Подключение к Twitch IRC установлено");

        reconnectDelay = 2000;
        receiveBuffer = "";

        const nickname = "justinfan" + Math.floor(Math.random() * 999999);

        socket.send("PASS SCHMOOPIIE");
        socket.send("NICK " + nickname);
        socket.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
        socket.send("JOIN #" + CHANNEL);
    };

    socket.onmessage = event => {
        receiveBuffer += event.data;

        const messages = receiveBuffer.split("\r\n");
        receiveBuffer = messages.pop();

        messages.forEach(message => {
            if (message.length > 0) {
                handleIRCMessage(message);
            }
        });
    };

    socket.onerror = error => {
        console.log("Ошибка подключения к Twitch IRC", error);
    };

    socket.onclose = () => {
        console.log(`Соединение закрыто. Повторное подключение через ${reconnectDelay / 1000} сек.`);

        setTimeout(connectToChat, reconnectDelay);

        reconnectDelay = Math.min(reconnectDelay * 2, 30000);
    };
}

setInterval(() => {
    updateTimer();
    updateMoscowTime();
}, 1000);

updateTimer();
updateMoscowTime();
updateTotal();
triggerTotalFade();

connectToChat();
</script>

</body>
</html>
