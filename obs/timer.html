<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">

<title>Twitch Stream Timer</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0 10px 0 0;
        background: transparent;
        font-family: 'Russo One', sans-serif;
        display: flex;
        align-items: flex-start;
        justify-content: flex-end;
        overflow: hidden;
    }

    #container {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        justify-content: flex-start;
        text-align: right;
        width: 100%;
        padding: 0;
    }

    .timer-row {
        display: flex;
        align-items: baseline;
        justify-content: flex-end;
        white-space: nowrap;
        width: 100%;
    }

    .timer-label {
        color: white;
        font-size: 72px;
        margin-right: 12px;
        white-space: nowrap;
        line-height: 1.1;
        text-shadow: none;
    }

    #timer,
    #extraTimer {
        display: inline-block;
        width: 390px;
        text-align: right;
        font-size: 72px;
        font-weight: normal;
        letter-spacing: 2px;
        white-space: nowrap;
        line-height: 1.1;
        text-shadow: none;
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum";
    }

    #timer {
        color: #36e36b;
        transition: color 0.5s ease, opacity 0.3s ease;
    }

    #extraTimer {
        color: white;
    }

    #resetStatsButton {
        margin-top: 10px;
        padding: 7px 14px;
        font-family: 'Russo One', sans-serif;
        font-size: 13px;
        color: white;
        background: rgba(40, 40, 40, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.2s ease;
    }

    #resetStatsButton:hover {
        background: rgba(100, 40, 40, 0.9);
    }

    #resetStatsButton:active {
        background: rgba(150, 40, 40, 0.9);
    }

    #totalMessages {
        margin-top: 12px;
        color: white;
        font-size: 20px;
        text-align: right;
        width: 100%;
    }

    #topUsers {
        margin-top: 5px;
        color: white;
        font-size: 18px;
        line-height: 1.5;
        text-align: right;
        width: 100%;
    }

    #settingsButton {
        position: fixed;
        right: 18px;
        bottom: 8px;
        width: 32px;
        height: 32px;
        font-size: 18px;
        color: white;
        background: rgba(40, 40, 40, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 5px;
        cursor: pointer;
        z-index: 1000;
    }

    #settingsPanel {
        display: none;
        position: fixed;
        right: 18px;
        bottom: 45px;
        padding: 12px;
        background: rgba(20, 20, 20, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 6px;
        color: white;
        font-family: 'Russo One', sans-serif;
        font-size: 12px;
        z-index: 1000;
        text-align: right;
    }

    #settingsPanel input {
        width: 55px;
        padding: 5px;
        margin: 4px 2px;
        background: #333;
        color: white;
        border: 1px solid #777;
        border-radius: 3px;
        font-family: 'Russo One', sans-serif;
        text-align: center;
    }

    #settingsPanel button {
        margin: 5px 2px;
        padding: 6px 9px;
        background: #444;
        color: white;
        border: 1px solid #888;
        border-radius: 4px;
        font-family: 'Russo One', sans-serif;
        font-size: 11px;
        cursor: pointer;
    }

    #settingsPanel button:hover {
        background: #666;
    }

    #settingsStatus {
        margin-top: 5px;
        color: #36e36b;
        font-size: 11px;
    }
</style>
</head>

<body>

<div id="container">

    <div class="timer-row">
        <span class="timer-label">Без сообщений уже</span>
        <div id="timer">00:00:00</div>
    </div>

    <div class="timer-row">
        <span class="timer-label">Стрим идёт уже</span>
        <div id="extraTimer">00:00:00</div>
    </div>

    <button id="resetStatsButton" type="button">
        Сбросить топ сообщений
    </button>

    <div id="totalMessages">Всего сообщений — 0</div>
    <div id="topUsers"></div>

</div>

<button id="settingsButton" type="button">⚙</button>

<div id="settingsPanel">
    <div>Установить время таймера:</div>

    <input id="inputHours" type="number" min="0" placeholder="Часы">
    <input id="inputMinutes" type="number" min="0" max="59" placeholder="Мин">
    <input id="inputSeconds" type="number" min="0" max="59" placeholder="Сек">

    <div>
        <button id="setTimeButton" type="button">Установить</button>
        <button id="resetTimeButton" type="button">Сбросить</button>
    </div>

    <div id="settingsStatus"></div>
</div>

<script>
const CHANNEL = "ganstfeveral";

const timerElement = document.getElementById("timer");
const extraTimerElement = document.getElementById("extraTimer");
const totalMessagesElement = document.getElementById("totalMessages");
const topUsersElement = document.getElementById("topUsers");

const resetStatsButton = document.getElementById("resetStatsButton");

const settingsButton = document.getElementById("settingsButton");
const settingsPanel = document.getElementById("settingsPanel");

const inputHours = document.getElementById("inputHours");
const inputMinutes = document.getElementById("inputMinutes");
const inputSeconds = document.getElementById("inputSeconds");

const setTimeButton = document.getElementById("setTimeButton");
const resetTimeButton = document.getElementById("resetTimeButton");
const settingsStatus = document.getElementById("settingsStatus");

let lastMessageTime = Date.now();

let totalMessages = 0;
let users = new Map();

let extraTimerStartTime = Date.now();
let extraTimerOffset = 0;

let socket = null;
let reconnectDelay = 2000;
let receiveBuffer = "";

function formatTime(totalSeconds) {
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    return [
        String(hours).padStart(2, "0"),
        String(minutes).padStart(2, "0"),
        String(seconds).padStart(2, "0")
    ].join(":");
}

function updateTimer() {
    const elapsed = Math.floor((Date.now() - lastMessageTime) / 1000);

    timerElement.textContent = formatTime(elapsed);

    // Цвет
    if (elapsed < 60) {
        timerElement.style.color = "#36e36b";
    } else if (elapsed < 120) {
        timerElement.style.color = "#c8dc43";
    } else if (elapsed < 180) {
        timerElement.style.color = "#ffe600";
    } else if (elapsed < 240) {
        timerElement.style.color = "#ff981c";
    } else {
        timerElement.style.color = "#ff3434";
    }

    // Прозрачность: первая секунда — полностью прозрачный, к 25-й — полностью непрозрачный
    if (elapsed < 1) {
        timerElement.style.opacity = "0";
    } else if (elapsed < 25) {
        const progress = (elapsed - 1) / 24; // от 0 до 1 за 24 секунды
        timerElement.style.opacity = progress.toFixed(3);
    } else {
        timerElement.style.opacity = "1";
    }
}

function updateExtraTimer() {
    const elapsedSeconds = extraTimerOffset + Math.floor(
        (Date.now() - extraTimerStartTime) / 1000
    );

    extraTimerElement.textContent = formatTime(elapsedSeconds);
}

function updateTotal() {
    totalMessagesElement.textContent = `Всего сообщений — ${totalMessages}`;
}

function updateTop() {
    const sortedUsers = Array.from(users.entries())
        .sort((a, b) => b[1].count - a[1].count)
        .slice(0, 5);

    topUsersElement.innerHTML = "";

    sortedUsers.forEach(([login, data]) => {
        const line = document.createElement("div");
        line.textContent = `${data.name} – ${data.count}`;
        topUsersElement.appendChild(line);
    });
}

function resetStatistics() {
    totalMessages = 0;
    users.clear();

    updateTotal();
    updateTop();

    console.log("Статистика сообщений сброшена");
}

resetStatsButton.addEventListener("click", resetStatistics);

function processMessage(tags, username) {
    lastMessageTime = Date.now();

    totalMessages++;

    const login = username.toLowerCase();
    const displayName = tags["display-name"] || username;

    if (users.has(login)) {
        const userData = users.get(login);
        userData.count++;
        userData.name = displayName;
    } else {
        users.set(login, {
            name: displayName,
            count: 1
        });
    }

    updateTimer();
    updateTotal();
    updateTop();
}

function parseTags(rawTags) {
    const tags = {};

    rawTags.split(";").forEach(tag => {
        const separatorIndex = tag.indexOf("=");

        if (separatorIndex === -1) {
            tags[tag] = "";
        } else {
            const key = tag.substring(0, separatorIndex);
            const value = tag.substring(separatorIndex + 1);

            tags[key] = value
                .replace(/\\s/g, " ")
                .replace(/\\:/g, ";")
                .replace(/\\r/g, "\r")
                .replace(/\\n/g, "\n")
                .replace(/\\\\/g, "\\");
        }
    });

    return tags;
}

function handleIRCMessage(message) {
    if (message.startsWith("PING")) {
        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send("PONG :tmi.twitch.tv");
        }
        return;
    }

    let tags = {};

    if (message.startsWith("@")) {
        const spaceIndex = message.indexOf(" ");

        if (spaceIndex === -1) return;

        tags = parseTags(message.substring(1, spaceIndex));
        message = message.substring(spaceIndex + 1);
    }

    const match = message.match(/^:([^!]+)!.* PRIVMSG #[^ ]+ :/);

    if (match) {
        const username = match[1];
        processMessage(tags, username);
    }
}

function connectToChat() {
    socket = new WebSocket("wss://irc-ws.chat.twitch.tv:443");

    socket.onopen = () => {
        console.log("Подключение к Twitch IRC установлено");

        reconnectDelay = 2000;
        receiveBuffer = "";

        const nickname = "justinfan" + Math.floor(Math.random() * 999999);

        socket.send("PASS SCHMOOPIIE");
        socket.send("NICK " + nickname);
        socket.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
        socket.send("JOIN #" + CHANNEL);
    };

    socket.onmessage = event => {
        receiveBuffer += event.data;

        const messages = receiveBuffer.split("\r\n");
        receiveBuffer = messages.pop();

        messages.forEach(message => {
            if (message.length > 0) {
                handleIRCMessage(message);
            }
        });
    };

    socket.onerror = error => {
        console.log("Ошибка подключения к Twitch IRC", error);
    };

    socket.onclose = () => {
        console.log(`Соединение закрыто. Повторное подключение через ${reconnectDelay / 1000} сек.`);

        setTimeout(connectToChat, reconnectDelay);

        reconnectDelay = Math.min(reconnectDelay * 2, 30000);
    };
}

settingsButton.addEventListener("click", () => {
    const isVisible = settingsPanel.style.display === "block";
    settingsPanel.style.display = isVisible ? "none" : "block";
});

setTimeButton.addEventListener("click", () => {
    const hours = Math.max(0, Number(inputHours.value) || 0);
    const minutes = Math.max(0, Number(inputMinutes.value) || 0);
    const seconds = Math.max(0, Number(inputSeconds.value) || 0);

    extraTimerOffset = hours * 3600 + minutes * 60 + seconds;
    extraTimerStartTime = Date.now();

    updateExtraTimer();

    settingsStatus.textContent = "Время установлено";
});

resetTimeButton.addEventListener("click", () => {
    extraTimerOffset = 0;
    extraTimerStartTime = Date.now();

    inputHours.value = "";
    inputMinutes.value = "";
    inputSeconds.value = "";

    updateExtraTimer();

    settingsStatus.textContent = "Таймер сброшен";
});

setInterval(() => {
    updateTimer();
    updateExtraTimer();
}, 1000);

updateTimer();
updateExtraTimer();
updateTotal();
updateTop();

connectToChat();
</script>

</body>
</html>
